<!DOCTYPE html>
<html>
<head>
    <title>Menu - Table {{ table_id }}</title>
    <style>
        .item {
            margin-bottom: 15px;
        }
        input[type=number] {
            width: 50px;
        }
    </style>
</head>
<body>
    <h1>Menu - Table {{ table_id }}</h1>

<form method="POST" action="/add-to-order/{{ table_id }}">
  {% for item in menu_items %}
    <div style="margin-bottom: 1em;">
      <strong>{{ item.name }}</strong> — ${{ item.price }}<br>

      Quantity:
      <input type="number" name="quantities[{{ item.id }}]" value="0" min="0">
      
      <input type="hidden" name="prices[{{ item.id }}]" value="{{ item.price }}">
    </div>
  {% endfor %}

  <button type="submit">Add Order</button>
</form>
</body>
</html>
